[project]
name = "doraymon"
version = "0.1.0"
description = "QQ conversation and nearby dining assistant"
requires-python = ">=3.12"
dependencies = [
  "nonebot2[aiohttp]>=2.5,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "aiohttp>=3.12,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "aiosqlite>=0.21,<1",
  "cachetools>=6,<8",
  "aiolimiter>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-socket>=0.7,<1", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doraymon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
