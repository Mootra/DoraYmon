qqbot:
  appid: ""
  secret: ""
  sandbox: true

deepseek:
  api_key: ""
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  temperature: 0.7

bot:
  command_prefix: "/"
  admin_openids: []

food:
  natural_trigger: true

chat:
  history_enabled: false
  history_limit: 10
  history_max_content_length: 1000
  context_max_chars: 6000
  context_summary_max_chars: 1200
  context_ttl_minutes: 60

rag:
  enabled: false
  knowledge_dir: "resources/knowledge"
  top_k: 3
  tokenizer: "trigram"
  max_context_chars: 6000
  chunk_max_chars: 800
  chunk_overlap_chars: 100

log:
  level: "INFO"

paths:
  data_dir: "data"
  log_dir: "logs"
